services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hb
      POSTGRES_PASSWORD: change-this-password
      POSTGRES_DB: hungry_bowl
    volumes:
      - hb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hb -d hungry_bowl"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hb:change-this-password@db:5432/hungry_bowl
      DIRECT_URL: postgresql://hb:change-this-password@db:5432/hungry_bowl
      # A long-running container can hold a stream open, so SSE is fine here.
      REALTIME_DRIVER: sse
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  hb_pgdata:
